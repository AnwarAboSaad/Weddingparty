rgin:0}.add-guest-row button,.admin-panel button{background:#4a8c4a;color:#fff;border:0;border-radius:8px;padding:0 14px;cursor:pointer}.admin-panel{margin-bottom:20px}.admin-panel .row{display:flex;gap:10px}.admin-panel .row input:first-child{max-width:120px}#save-status{font-size:12px;color:#4a8c4a}.backup-panel{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:nowrap;margin:0 0 10px;white-space:nowrap}.backup-btn{border:0;border-radius:10px;padding:7px 9px;cursor:pointer;font-family:inherit;font-size:11px;white-space:nowrap}.backup-download{background:#b08d57;color:#fff}.backup-import{background:#6a5acd;color:#fff}.backup-input{display:none}#seating-view{display:none}#seating-toolbar{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:nowrap;white-space:nowrap}#add-table-map-btn,#add-aisle-btn{background:#4a8c4a;color:#fff;border:0;border-radius:18px;padding:8px 11px;cursor:pointer;font-size:12px;white-space:nowrap}#add-aisle-btn{background:#6a5acd}#add-aisle-btn:disabled{background:#ccc}#floor-plan-wrapper{background:#fff;border-radius:16px;box-shadow:0 2px 8px #0002;overflow:visible;margin-bottom:16px}#floor-plan{position:relative;width:100%;height:760px;background:#fff;touch-action:pinch-zoom}#floor-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.floor-label{position:absolute;color:#b08d57;font-size:13px;text-align:center;z-index:1;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%)}.total-count-label{text-align:center;color:#555;font-size:14px;font-weight:bold;margin:0 0 12px}.dev-credit{text-align:center;color:#bbb;font-size:10px;line-height:1.05;margin:1px 0 3px}.table-box,.slot-box,.aisle-box{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;user-select:none;z-index:2}.table-box{border-radius:8px;background:#b08d57;color:#fff;box-shadow:0 2px 6px #0003;touch-action:none}.table-box .box-name,.slot-box .box-name{font-size:8px;font-weight:bold}.table-box .box-count,.slot-box .box-count{font-size:6px}.editable{cursor:grab}.dragging{cursor:grabbing;opacity:.85;z-index:10}.box-ctrl{position:absolute;width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;z-index:11}.box-rotate{background:#6a5acd}.box-delete{background:#c0392b}.slot-box{border-radius:6px}.slot-box.filled{background:#8a6d3b;color:#fff;box-shadow:0 2px 6px #0003}.slot-box.empty{background:#f7f2ea;border:2px dashed #b08d57;color:#b08d57;font-size:10px}.slot-box.clickable,.slot-box.filled.clickable{cursor:pointer}.aisle-box{border-radius:4px;background:repeating-linear-gradient(45deg,#6a5acd,#6a5acd 6px,#7a6bd9 6px,#7a6bd9 12px);color:#fff;font-size:9px;font-weight:bold;box-shadow:0 2px 6px #0003;touch-action:none}#modal-overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:999;padding:20px}#modal-box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:360px;max-height:80vh;overflow:auto}#modal-box h3{text-align:center}.modal-option,.modal-close{display:block;width:100%;padding:10px;margin-bottom:8px;border-radius:8px;cursor:pointer}.modal-option{background:#f7f2ea;border:1px solid #ddd;text-align:right}.modal-close{background:#eee;border:0}

<script>
const ADMIN_PASSWORD="2412";
const firebaseConfig={apiKey:"AIzaSyDRGodtyKvHhIyO33AeSHOFcTTzkEKEXWE",authDomain:"wedding-5ee28.firebaseapp.com",projectId:"wedding-5ee28",storageBucket:"wedding-5ee28.firebasestorage.app",messagingSenderId:"446620021297",appId:"1:446620021297:web:f1c6efca483f0a09f01b10"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),tablesRef=db.collection("app").doc("guest-tables"),seatingRef=db.collection("app").doc("seating-layout");
const FieldValue=firebase.firestore.FieldValue;
const defaultTables={};
let currentData={},placements={},circleSlots={},isUnlocked=false,currentView="search",dragState=null,danceGeo={cx:0,cy:0,r:0};const pendingPlacementWrites={};const CIRCLE_SLOTS_COUNT=15,AISLE_KEY="__AISLE__",ROTATE_STEP=5;
const DEFAULT_AISLE={x:50,y:15,rot:0};
const $=id=>document.getElementById(id),resultsDiv=$("results"),totalCountEl=$("total-count"),totalTablesCountEl=$("total-tables-count"),searchInput=$("search"),statusEl=$("save-status"),lockBtn=$("lock-btn"),adminPanel=$("admin-panel"),searchView=$("search-view"),seatingView=$("seating-view"),seatingToolbar=$("seating-toolbar"),chartBtn=$("chart-btn"),floorPlan=$("floor-plan"),floorSvg=$("floor-svg"),danceLabel=$("dance-label"),modalOverlay=$("modal-overlay"),modalBox=$("modal-box");

// === حفظ آمن للخريطة ===
// كل تعديل على الخريطة يُحفظ داخل Transaction بعد قراءة آخر نسخة من Firebase.
// لا نستبدل وثيقة seating-layout كاملة، ولا نحذف أي طاولة أو ممر تلقائياً.
function cacheSeating(){
  try{
    localStorage.setItem("wedding_seating_cache_v3",JSON.stringify({
      placements:placements||{},
      circleSlots:circleSlots||{},
      savedAt:new Date().toISOString()
    }));
  }catch(e){console.warn("local seating cache unavailable",e)}
}

function loadSeatingCache(){
  try{
    const raw=localStorage.getItem("wedding_seating_cache_v3");
    if(!raw)return;
    const c=JSON.parse(raw);
    if(c&&typeof c==="object"){
      if(c.placements&&typeof c.placements==="object")placements=c.placements;
      if(c.circleSlots&&typeof c.circleSlots==="object")circleSlots=c.circleSlots;
    }
    if(!placements[AISLE_KEY])placements[AISLE_KEY]={...DEFAULT_AISLE};
  }catch(e){console.warn("local seating cache invalid",e)}
}

// يحفظ التعديل بعد قراءة آخر نسخة من Firebase داخل Transaction.
// مهم جداً: لا نكتب نسخة محلية قديمة فوق النسخة الموجودة على Firebase.
async function savePlacement(key,patch){
  const k=String(key);
  // حدّث الشاشة والنسخة المحلية فوراً، ثم احفظ الحقول المعدّلة فقط في Firestore.
  placements[k]={...(placements[k]||{}),...patch};
  cacheSeating();
  pendingPlacementWrites[k]={...(pendingPlacementWrites[k]||{}),...patch};
  try{
    const updates={};
    Object.keys(patch).forEach(field=>{
      updates[new firebase.firestore.FieldPath("placements",k,field)]=patch[field];
    });
    await seatingRef.update(updates);
    delete pendingPlacementWrites[k];
    cacheSeating();
    statusEl.textContent="✓ تم حفظ التعديل";
    setTimeout(()=>{if(statusEl.textContent==="✓ تم حفظ التعديل")statusEl.textContent=""},1200);
    return true;
  }catch(e){
    console.error("savePlacement failed",e);
    // إذا فشل الحفظ السحابي، لا نرجّع العنصر لمكانه القديم؛ يبقى محفوظاً محلياً.
    cacheSeating();
    statusEl.textContent="⚠ لم يُحفظ على Firebase — سيبقى محلياً";
    return false;
  }
}
async function deletePlacement(key){
  try{
    await seatingRef.update(new firebase.firestore.FieldPath("placements",String(key)),FieldValue.delete());
    delete placements[String(key)];
    cacheSeating();
    return true;
  }catch(e){
    console.error("deletePlacement failed",e);
    cacheSeating();
    return false;
  }
}

async function saveCircleSlot(i,value,remove=false){
  try{
    const field=new firebase.firestore.FieldPath("circleSlots",String(i));
    if(remove){
      await seatingRef.update(field,FieldValue.delete());
      delete circleSlots[String(i)];
    }else{
      await seatingRef.set({circleSlots:{[String(i)]:value}},{merge:true});
      circleSlots[String(i)]=value;
    }
    cacheSeating();
    return true;
  }catch(e){
    console.error("saveCircleSlot failed",e);
    cacheSeating();
    return false;
  }
}

function toggleLock(){if(isUnlocked){isUnlocked=false;updateLockUI();renderCurrentView();return}const v=prompt("أدخل كلمة السر للفتح:");if(v===null)return;if(v===ADMIN_PASSWORD){isUnlocked=true;updateLockUI();renderCurrentView()}else alert("كلمة السر غير صحيحة")}
function updateLockUI(){lockBtn.textContent=isUnlocked?"🔓":"🔒";lockBtn.classList.toggle("unlocked",isUnlocked);adminPanel.style.display=isUnlocked&&currentView==="search"?"block":"none";seatingToolbar.style.display=isUnlocked&&currentView==="seating"?"flex":"none"}
function toggleView(){currentView=currentView==="search"?"seating":"search";searchView.style.display=currentView==="search"?"block":"none";seatingView.style.display=currentView==="seating"?"block":"none";chartBtn.textContent=currentView==="search"?"🪑":"🔎";updateLockUI();renderCurrentView()}
function renderCurrentView(){if(currentView==="seating"&&!placements[AISLE_KEY])placements[AISLE_KEY]={...DEFAULT_AISLE};currentView==="search"?renderTables(searchInput.value.trim()||null):(drawFloorPlan(),renderCircleSlots(),renderPlacements())}
function drawFloorPlan(){const w=floorPlan.clientWidth,h=floorPlan.clientHeight;if(!w||!h)return;floorSvg.setAttribute("viewBox",`0 0 ${w} ${h}`);const cy=h/2,r=Math.min(w,h)*.22,cx=4;danceGeo={cx,cy,r};floorSvg.innerHTML=`<path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r}" stroke="#b08d57" stroke-width="2" stroke-dasharray="7 7" fill="none"/>`;danceLabel.style.left=cx+r*.5+"px";danceLabel.style.top=cy+"px"}
addEventListener("resize",()=>{if(currentView==="seating"){drawFloorPlan();renderCircleSlots();renderPlacements()}});

function normalizeTables(data){const out={};Object.keys(data).forEach(k=>{const v=data[k];out[k]=Array.isArray(v)?{count:null,tablesCount:null,names:v}:v&&typeof v==="object"?{count:typeof v.count==="number"?v.count:null,tablesCount:typeof v.tablesCount==="number"?v.tablesCount:null,names:Array.isArray(v.names)?v.names:[]}:{count:null,tablesCount:null,names:[]}});return out}

function startListening(){
  statusEl.textContent="";
  tablesRef.onSnapshot(s=>{
    if(s.exists){
      const raw=s.data().tables;
      // مهم: القراءة الفارغة لا تعني أن التطبيق يجب أن يكتب بيانات فارغة فوق Firebase.
      currentData=raw&&typeof raw==="object"?normalizeTables(raw):{};
      statusEl.textContent="";
    }else{
      // لا ننشئ مستنداً فارغاً تلقائياً. هذا يمنع تشغيل التطبيق لأول مرة/بعد حذف مستند
      // من أن يكتب {} فوق قاعدة البيانات أو البيانات الاحتياطية.
      currentData={};
      statusEl.textContent="";
    }
    // ممنوع تنظيف الخريطة تلقائياً بناءً على قراءة ناقصة؛ هذا كان سبباً محتملاً لحذف
    // placements / circleSlots عندما تصل قراءة فارغة أو متأخرة من Firebase.
    if(!dragState)renderCurrentView();
  },e=>{console.error(e);statusEl.textContent="⚠ خطأ بالاتصال"});

  // نقرأ الخريطة بدون اعتبار غياب الحقل = خريطة فارغة.
  // هذا يمنع Snapshot قديم/ناقص من إعادة الطاولات أو الممرات المحذوفة/المضافة.
  loadSeatingCache();
  seatingRef.onSnapshot(s=>{
    const d=s.exists?s.data():{};
    if(Object.prototype.hasOwnProperty.call(d,"placements") && d.placements && typeof d.placements==="object"){
      const remote=d.placements;
      // لا تسمح لـ snapshot قديم أن يعيد عنصراً تم تحريكه للتو إلى مكانه السابق.
      placements={...remote};
      Object.keys(pendingPlacementWrites).forEach(k=>{
        placements[k]={...(placements[k]||{}),...pendingPlacementWrites[k]};
      });
    }
    if(Object.prototype.hasOwnProperty.call(d,"circleSlots") && d.circleSlots && typeof d.circleSlots==="object"){
      circleSlots=d.circleSlots;
    }
    if(!placements[AISLE_KEY])placements[AISLE_KEY]={...DEFAULT_AISLE};
    cacheSeating();
    if(currentView==="seating"&&!dragState){renderCircleSlots();renderPlacements()}
  },(e)=>{
    console.error(e);
    // عند انقطاع الاتصال لا نمسح الخريطة من الشاشة.
  });
}

// حفظ آمن: لا يستبدل خريطة tables كاملة، ولا يسمح بكتابة {} فوق بيانات موجودة.
// merge=true يحافظ على الحقول الأخرى الموجودة في المستند.
async function saveData(){
  if(!Object.keys(currentData).length){
    console.warn("Blocked empty save to protect Firestore data.");

    return false;
  }
  try{

    await db.runTransaction(async tx=>{
      const snap=await tx.get(tablesRef);
      const remote=snap.exists&&snap.data().tables&&typeof snap.data().tables==="object"?snap.data().tables:{};
      if(Object.keys(remote).length>0 && Object.keys(currentData).length===0){
        throw new Error("EMPTY_SAVE_BLOCKED");
      }
      // ندمج الجداول الحالية بدلاً من استبدال tables بالكامل.
      tx.set(tablesRef,{tables:currentData},{merge:true});
    });

    return true;
  }catch(e){
    console.error(e);

    return false;
  }
}

// حذف طاولة فقط عند طلب المستخدم صراحةً. لا يوجد حذف تلقائي بسبب القراءة أو الاتصال.
async function deleteTableSafely(t){
  try{
    await db.runTransaction(async tx=>{
      const snap=await tx.get(tablesRef);
      if(!snap.exists)throw new Error("DOCUMENT_NOT_FOUND");
      const remote=snap.data().tables||{};
      if(!Object.prototype.hasOwnProperty.call(remote,t))throw new Error("TABLE_NOT_FOUND");
      tx.update(tablesRef,new firebase.firestore.FieldPath("tables",String(t)),FieldValue.delete());
    });
    return true;
  }catch(e){console.error(e);alert("لم يتم حذف الطاولة. البيانات بقيت محفوظة.");return false}
}

// === نسخة احتياطية محلية للهاتف ===
function makeBackupObject(){
  return {
    backupVersion:2,
    createdAt:new Date().toISOString(),
    projectId:firebaseConfig.projectId,
    guestTables:currentData,
    seating:{placements:placements,circleSlots:circleSlots}
  };
}

function downloadBackup(){
  if(!Object.keys(currentData).length){alert("لا توجد بيانات طاولات حالياً لعمل نسخة احتياطية.");return;}
  const backup=makeBackupObject();
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().replace(/[:.]/g,"-");
  a.href=url;a.download=`wedding-backup-${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  alert("تم حفظ نسخة احتياطية تشمل المعازيم + كل الطاولات الثابتة والمضافة + أماكنها + دورانها + الممر + توزيع الطاولات حول ساحة الرقص. احفظ الملف على هاتفك أو iCloud/Google Drive.");
}

async function importBackup(event){
  const file=event.target.files&&event.target.files[0];
  event.target.value="";
  if(!file)return;
  try{
    const text=await file.text();
    const backup=JSON.parse(text);
    if(!backup||![1,2].includes(backup.backupVersion)||!backup.guestTables||typeof backup.guestTables!=="object"){
      throw new Error("INVALID_BACKUP");
    }
    const restoredTables=normalizeTables(backup.guestTables);
    const restoredSeating=backup.seating&&typeof backup.seating==="object"?backup.seating:{};
    const restoredPlacements=restoredSeating.placements&&typeof restoredSeating.placements==="object"?restoredSeating.placements:{};
    const restoredCircleSlots=restoredSeating.circleSlots&&typeof restoredSeating.circleSlots==="object"?restoredSeating.circleSlots:{};
    if(!Object.keys(restoredTables).length)throw new Error("EMPTY_BACKUP");
    if(!confirm(`النسخة تحتوي على ${Object.keys(restoredTables).length} طاولة.\nسيتم استرجاع البيانات من الملف بدون حذف أي بيانات موجودة حالياً. متابعة؟`))return;

    // الاستيراد هنا استرجاع/دمج فقط: لا نحذف أي حقل موجود حالياً.
    await db.runTransaction(async tx=>{
      const snap=await tx.get(tablesRef);
      const remote=snap.exists&&snap.data().tables&&typeof snap.data().tables==="object"?snap.data().tables:{};
      const merged={...remote,...restoredTables};
      tx.set(tablesRef,{tables:merged},{merge:true});
    });
    await seatingRef.set({placements:restoredPlacements,circleSlots:restoredCircleSlots},{merge:true});
    currentData=restoredTables;
    placements={...placements,...restoredPlacements};
    circleSlots={...circleSlots,...restoredCircleSlots};
    renderCurrentView();
    alert("تم استيراد النسخة الاحتياطية بنجاح.");
  }catch(e){
    console.error(e);
    alert("فشل استيراد النسخة الاحتياطية. الملف لم يغيّر قاعدة البيانات.");
  }
}

function sortedTableKeys(){return Object.keys(currentData).sort((a,b)=>{const x=Number(a),y=Number(b);return !isNaN(x)&&!isNaN(y)?x-y:a.localeCompare(b,"ar")})}

function renderTables(filter){resultsDiv.innerHTML="";let found=false;sortedTableKeys().forEach(table=>{const t=currentData[table],matches=filter?t.names.filter(n=>n.includes(filter)):t.names;if(filter&&!matches.length)return;found=true;const card=document.createElement("div");card.className="card";const list=t.names.map((n,i)=>`<li><span class="${filter&&n.includes(filter)?"highlight":""}">${i+1}. ${n}</span>${isUnlocked?`<span class="del-guest" onclick="deleteGuest('${table}','${n.replace(/'/g,"\\'")}')">✕</span>`:""}</li>`).join("");const actions=isUnlocked?`<span class="table-actions"><span class="edit-table" onclick="renameTable('${table.replace(/'/g,"\\'")}')">✏️ تعديل الاسم</span><span class="del-table" onclick="deleteTable('${table}')">حذف الطاولة</span></span>`:"";const cf=(name,label,val,fn)=>isUnlocked?`<div class="count-field">${label}: <input type="number" min="0" value="${val??""}" placeholder="—" onchange="${fn}('${table}',this.value)"></div>`:`<div class="count-field-readonly">${label}: ${val??"—"}</div>`;card.innerHTML=`<h3>طاولة ${table}${actions}</h3>${cf("count","عدد الأشخاص",t.count,"updateTableCount")}${cf("tablesCount","عدد الطاولات",t.tablesCount,"updateTableTablesCount")}<ul>${list}</ul>${isUnlocked?`<div class="add-guest-row"><input id="add-guest-${table}" placeholder="اسم معزوم جديد"><button onclick="addGuest('${table}')">إضافة</button></div>`:""}`;resultsDiv.appendChild(card)});if(!found)resultsDiv.innerHTML='<p class="no-results">لا يوجد نتائج</p>';updateTotalCount()}

function updateTotalCount(){totalCountEl.textContent=`إجمالي عدد الأشخاص: ${Object.values(currentData).reduce((s,t)=>s+(typeof t.count==="number"?t.count:0),0)}`;totalTablesCountEl.textContent=`إجمالي عدد الطاولات: ${Object.values(currentData).reduce((s,t)=>s+(typeof t.tablesCount==="number"?t.tablesCount:0),0)}`}

searchInput.addEventListener("input",function(){renderTables(this.value.trim()||null)});
async function addTable(){const a=$("new-table-num"),b=$("new-table-names"),num=a.value.trim();if(!num||currentData[num])return alert("اسم الطاولة فارغ أو مستخدم مسبقاً");currentData[num]={count:null,tablesCount:null,names:b.value.trim()?b.value.split(".").map(x=>x.trim()).filter(Boolean):[]};a.value=b.value="";await saveData()}
async function deleteTable(t){if(confirm(`متأكد من حذف الطاولة "${t}"؟\nلن يتم حذف أي بيانات أخرى.`)){if(await deleteTableSafely(t)){delete currentData[t];renderCurrentView()}}}
async function updateTableCount(t,v){currentData[t].count=v.trim()===""?null:Math.max(0,parseInt(v,10)||0);await saveData()}
async function updateTableTablesCount(t,v){currentData[t].tablesCount=v.trim()===""?null:Math.max(0,parseInt(v,10)||0);await saveData()}
async function renameTable(old){
  const n=prompt("اسم الطاولة الجديد:",old);if(n===null)return;
  const x=n.trim();if(!x||x===old)return;
  if(currentData[x])return alert("في طاولة تانية مسجلة بنفس هالاسم");
  try{
    await db.runTransaction(async tx=>{
      const snap=await tx.get(tablesRef);
      if(!snap.exists)throw new Error("DOCUMENT_NOT_FOUND");
      const remote=snap.data().tables||{};
      if(!remote[old])throw new Error("TABLE_NOT_FOUND");
      if(remote[x])throw new Error("TARGET_EXISTS");
      tx.set(tablesRef,{tables:{[x]:remote[old]}},{merge:true});
      tx.update(tablesRef,new firebase.firestore.FieldPath("tables",String(old)),FieldValue.delete());
    });
    const value=currentData[old];
    const rebuilt={};Object.keys(currentData).forEach(k=>rebuilt[k===old?x:k]=currentData[k]);currentData=rebuilt;
    if(placements[old]){
      placements[x]=placements[old];delete placements[old];
      await deletePlacement(old);
      await savePlacement(x,placements[x]);
    }
    for(const i of Object.keys(circleSlots)){if(circleSlots[i]===old){circleSlots[i]=x;await saveCircleSlot(i,x,false)}}
    renderCurrentView();
  }catch(e){console.error(e);alert("لم يتم تغيير اسم الطاولة. البيانات بقيت محفوظة.");}
}

async function addGuest(t){const i=$(`add-guest-${t}`),n=i.value.trim();if(n){currentData[t].names.push(n);await saveData()}}
async function deleteGuest(t,n){currentData[t].names=currentData[t].names.filter(x=>x!==n);await saveData()}

function computeLength(k){if(k===AISLE_KEY)return 200;if(!currentData[k])return 60;return Math.min(40+(currentData[k].count||0)*4,300)}

function renderPlacements(){
  floorPlan.querySelectorAll(".table-box,.aisle-box").forEach(e=>e.remove());
  Object.keys(placements).forEach(k=>{
    const p=placements[k],aisle=k===AISLE_KEY;
    if(!aisle&&!currentData[k])return;
    const el=document.createElement("div");
    const heightPx=aisle?12:15;
    el.className=(aisle?"aisle-box ":"table-box ")+(isUnlocked?"editable":"locked-view");
    el.style.left=p.x+"%";el.style.top=p.y+"%";
    el.style.width=(aisle?200:computeLength(k))+"px";
    el.style.height=heightPx+"px";
    el.style.transform=`translate(-50%,-50%) rotate(${p.rot||0}deg)`;
    el.dataset.table=k;
    if(aisle)el.textContent="ممر العروسين";
    else{const t=currentData[k];el.innerHTML=`<div class="box-name">${k}</div><div class="box-count">${t.count??"—"}/${t.tablesCount??"—"}</div>`}
    if(isUnlocked){
      el.addEventListener("pointerdown",onBoxPointerDown);
      // نبعّد الأزرار عن الشريط حسب سماكته، منشان ما تصير فوق منطقة السحب وتلتقط اللمسة بالغلط
      const btnOffset=-(heightPx/2+14);
      [["⟳",-10,ROTATE_STEP],["⟲",16,-ROTATE_STEP]].forEach(([txt,left,d])=>{
        const b=document.createElement("div");
        b.className="box-ctrl box-rotate";b.textContent=txt;b.style.left=left+"px";b.style.top=btnOffset+"px";
        b.onpointerdown=e=>e.stopPropagation();
        b.onclick=e=>{e.stopPropagation();rotateTable(k,d)};
        el.appendChild(b);
      });
      if(!aisle){
        const d=document.createElement("div");
        d.className="box-ctrl box-delete";d.textContent="✕";d.style.right="-10px";d.style.top=btnOffset+"px";
        d.onpointerdown=e=>e.stopPropagation();
        d.onclick=e=>{e.stopPropagation();removeTableFromMap(k)};
        el.appendChild(d);
      }
    }
    floorPlan.appendChild(el);
  });
}

function onBoxPointerDown(e){
  if(!isUnlocked)return;
  const box=e.currentTarget,k=box.dataset.table;
  box.setPointerCapture(e.pointerId);
  box.classList.add("dragging");
  dragState={tableKey:k,box,rect:floorPlan.getBoundingClientRect(),startX:e.clientX,startY:e.clientY,origX:placements[k].x,origY:placements[k].y};
  box.addEventListener("pointermove",onBoxPointerMove);
  box.addEventListener("pointerup",onBoxPointerUp);
  box.addEventListener("pointercancel",onBoxPointerUp);
}
function onBoxPointerMove(e){
  if(!dragState)return;
  const x=Math.max(2,Math.min(98,dragState.origX+(e.clientX-dragState.startX)/dragState.rect.width*100)),
        y=Math.max(2,Math.min(98,dragState.origY+(e.clientY-dragState.startY)/dragState.rect.height*100));
  dragState.box.style.left=x+"%";dragState.box.style.top=y+"%";
  dragState.currentX=x;dragState.currentY=y;
}
async function onBoxPointerUp(){
  if(!dragState)return;
  const s=dragState;
  s.box.classList.remove("dragging");
  s.box.removeEventListener("pointermove",onBoxPointerMove);
  s.box.removeEventListener("pointerup",onBoxPointerUp);
  s.box.removeEventListener("pointercancel",onBoxPointerUp);
  if(s.currentX!==undefined){
    placements[s.tableKey].x=s.currentX;
    placements[s.tableKey].y=s.currentY;
    await savePlacement(s.tableKey,{x:s.currentX,y:s.currentY});
  }
  dragState=null;
  if(currentView==="seating"){renderCircleSlots();renderPlacements()}
}
async function rotateTable(k,d){
  const oldRot=placements[k].rot||0;
  const newRot=((oldRot+d)%360+360)%360;
  if(await savePlacement(k,{rot:newRot})){
    renderPlacements();
  }
}
async function removeTableFromMap(k){
  const label=k===AISLE_KEY?"ممر العروسين":k;
  if(!confirm(`متأكد إنك بدك تشيل "${label}" من الخريطة؟`))return;
  if(await deletePlacement(k)){
    renderPlacements();
  }
}

function getUsedTableKeys(){const s=new Set();Object.keys(placements).forEach(k=>{if(k!==AISLE_KEY)s.add(k)});Object.values(circleSlots).forEach(k=>s.add(k));return s}

function openAddTableToMap(){
  if(!isUnlocked)return alert("افتح القفل 🔒 أولاً");
  const available=sortedTableKeys().filter(k=>!getUsedTableKeys().has(k));
  modalBox.innerHTML=`<h3>اختر الطاولة</h3>${available.length?available.map(k=>`<button class="modal-option" onclick="addTableToMap('${k.replace(/'/g,"\\'")}')">${k} (${currentData[k].count||0} شخص)</button>`).join(""):'<p style="text-align:center;color:#777">كل الطاولات مضافة عالخريطة مسبقاً</p>'}<button class="modal-close" onclick="closeModal()">إغلاق</button>`;
  modalOverlay.style.display="flex";
}
async function addTableToMap(k){
  if(await savePlacement(k,{x:75,y:50,rot:0})){
    closeModal();
    renderPlacements();
  }
}

function renderCircleSlots(){
  floorPlan.querySelectorAll(".slot-box").forEach(e=>e.remove());
  if(!danceGeo.r)return;
  const{cx,cy,r}=danceGeo;
  for(let i=0;i<CIRCLE_SLOTS_COUNT;i++){
    const angle=-85+i/(CIRCLE_SLOTS_COUNT-1)*170,rad=angle*Math.PI/180,
          assigned=circleSlots[i],ok=assigned&&currentData[assigned],
          len=ok?computeLength(assigned):45,
          x=cx+(r+10+len/2)*Math.cos(rad),y=cy+(r+10+len/2)*Math.sin(rad),
          slot=document.createElement("div");
    slot.style.cssText=`left:${x}px;top:${y}px;width:${len}px;height:20px;transform:translate(-50%,-50%) rotate(${angle}deg)`;
    if(ok){
      const t=currentData[assigned];
      slot.className="slot-box filled"+(isUnlocked?" clickable":"");
      slot.innerHTML=`<div class="box-name">${assigned}</div><div class="box-count">${t.count??"—"}/${t.tablesCount??"—"}</div>`;
      if(isUnlocked)slot.onclick=()=>openCircleSlotPicker(i);
    }else{
      slot.className="slot-box empty"+(isUnlocked?" clickable":"");
      slot.textContent="+";
      if(isUnlocked)slot.onclick=()=>openCircleSlotPicker(i);
    }
    floorPlan.appendChild(slot);
  }
}
function openCircleSlotPicker(i){
  if(!isUnlocked)return;
  const current=circleSlots[i],used=getUsedTableKeys(),
        available=sortedTableKeys().filter(k=>!used.has(k)||k===current);
  let html=`<h3>اختر الطاولة لهالمكان</h3>`;
  html+=available.length?available.map(k=>{
    const selected=k===current?" ✓":"";
    return `<button class="modal-option" onclick="assignCircleSlot(${i},'${k.replace(/'/g,"\\'")}')">${k} (${currentData[k].count||0} شخص)${selected}</button>`;
  }).join(""):'<p style="text-align:center;color:#777">ما في طاولات متاحة</p>';
  if(current){
    html+=`<button class="modal-option" style="background:#fdeceb;color:#c0392b;border-color:#f2c1bd" onclick="assignCircleSlot(${i},null)">✕ إلغاء الربط</button>`;
  }
  html+=`<button class="modal-close" onclick="closeModal()">إغلاق</button>`;
  modalBox.innerHTML=html;
  modalOverlay.style.display="flex";
}
async function assignCircleSlot(i,k){
  let ok=false;
  if(k===null){
    ok=await saveCircleSlot(i,null,true);
  }else{
    ok=await saveCircleSlot(i,k,false);
  }
  if(ok){
    closeModal();
    renderCircleSlots();
  }
}

function updateAisleButtonState(){const b=$("add-aisle-btn");if(b)b.disabled=!!placements[AISLE_KEY]}
async function addAisleToMap(){
  if(!isUnlocked||placements[AISLE_KEY])return;
  if(await savePlacement(AISLE_KEY,{x:50,y:15,rot:0})){
    renderPlacements();
  }
}

function closeModal(){modalOverlay.style.display="none";modalBox.innerHTML=""}
modalOverlay.addEventListener("click",e=>{if(e.target===modalOverlay)closeModal()});
startListening();
</script></body></html>
