*{box-sizing:border-box}body{font-family:Tahoma,sans-serif;background:#f2ece1;margin:0;padding:20px;min-height:100vh}#app{max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:8px}header h1{font-size:20px;margin:0;flex:1;text-align:center;color:#333}.icon-btn{background:#b08d57;color:#fff;border:0;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}#lock-btn.unlocked{background:#4a8c4a}#chart-btn{background:#6a5acd}input{padding:12px;width:100%;font-size:16px;margin-bottom:14px;text-align:right;border:1px solid #ccc;border-radius:8px;font-family:inherit}.tables-container{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}@media(max-width:650px){.tables-container{grid-template-columns:1fr}}.card,.admin-panel{background:#fff;border-radius:12px;box-shadow:0 2px 5px #0002;padding:15px;text-align:right}.card h3{margin:0 0 10px;font-size:18px;border-bottom:1px solid #eee;padding-bottom:5px;display:flex;justify-content:space-between;align-items:center}.table-actions{display:flex;gap:6px}.del-table,.edit-table{cursor:pointer;font-size:13px;border-radius:6px;padding:2px 8px;background:#fff}.del-table{color:#c0392b;border:1px solid #c0392b}.edit-table{color:#6a5acd;border:1px solid #6a5acd}.count-field{font-size:13px;color:#555;margin-bottom:8px;display:flex;align-items:center;gap:6px}.count-field input{width:60px;padding:4px 6px;margin:0;font-size:13px;text-align:center}.count-field-readonly{font-size:13px;color:#777;margin-bottom:8px}.card ul{list-style:none;padding:0;margin:0}.card li{font-size:15px;margin-bottom:4px;display:flex;justify-content:space-between}.del-guest{color:#c0392b;cursor:pointer;font-weight:bold;padding:0 6px}.highlight{background:#fffa9c;font-weight:bold;padding:2px 5px;border-radius:4px}.no-results{text-align:center;grid-column:1/-1}.add-guest-row{display:flex;gap:6px;margin-top:8px}.add-guest-row input{margin:0}.add-guest-row button,.admin-panel button{background:#4a8c4a;color:#fff;border:0;border-radius:8px;padding:0 14px;cursor:pointer}.admin-panel{margin-bottom:20px}.admin-panel .row{display:flex;gap:10px}.admin-panel .row input:first-child{max-width:120px}#save-status{font-size:12px;color:#4a8c4a}#seating-view{display:none}#seating-toolbar{display:flex;justify-content:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}#add-table-map-btn,#add-aisle-btn{background:#4a8c4a;color:#fff;border:0;border-radius:20px;padding:10px 16px;cursor:pointer}#add-aisle-btn{background:#6a5acd}#add-aisle-btn:disabled{background:#ccc}#floor-plan-wrapper{background:#fff;border-radius:16px;box-shadow:0 2px 8px #0002;overflow:visible;margin-bottom:16px}#floor-plan{position:relative;width:100%;height:760px;background:#fff;touch-action:pinch-zoom}#floor-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.floor-label{position:absolute;color:#b08d57;font-size:13px;text-align:center;z-index:1;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%)}.total-count-label{text-align:center;color:#555;font-size:14px;font-weight:bold;margin:0 0 12px}.dev-credit{text-align:center;color:#bbb;font-size:11px;margin:4px 0 12px}.table-box,.slot-box,.aisle-box{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;user-select:none;z-index:2}.table-box{border-radius:8px;background:#b08d57;color:#fff;box-shadow:0 2px 6px #0003;touch-action:none}.table-box .box-name,.slot-box .box-name{font-size:8px;font-weight:bold}.table-box .box-count,.slot-box .box-count{font-size:6px}.editable{cursor:grab}.dragging{cursor:grabbing;opacity:.85;z-index:10}.box-ctrl{position:absolute;width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;z-index:11}.box-rotate{background:#6a5acd}.box-delete{background:#c0392b}.slot-box{border-radius:6px}.slot-box.filled{background:#8a6d3b;color:#fff;box-shadow:0 2px 6px #0003}.slot-box.empty{background:#f7f2ea;border:2px dashed #b08d57;color:#b08d57;font-size:10px}.slot-box.clickable,.slot-box.filled.clickable{cursor:pointer}.aisle-box{border-radius:4px;background:repeating-linear-gradient(45deg,#6a5acd,#6a5acd 6px,#7a6bd9 6px,#7a6bd9 12px);color:#fff;font-size:9px;font-weight:bold;box-shadow:0 2px 6px #0003;touch-action:none}#modal-overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:999;padding:20px}#modal-box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:360px;max-height:80vh;overflow:auto}#modal-box h3{text-align:center}.modal-option,.modal-close{display:block;width:100%;padding:10px;margin-bottom:8px;border-radius:8px;cursor:pointer}.modal-option{background:#f7f2ea;border:1px solid #ddd;text-align:right}.modal-close{background:#eee;border:0}
</style>
</head>
<body>
<div id="app"><header><button id="lock-btn" class="icon-btn" onclick="toggleLock()">🔒</button><h1>👰🤵 Abdo & Sulaf</h1><button id="chart-btn" class="icon-btn" onclick="toggleView()">🪑</button></header><div style="text-align:center;margin-bottom:10px"><span id="save-status"></span></div>
<div id="search-view"><input id="search" placeholder="اكتب الاسم هنا..."><p id="total-count" class="total-count-label"></p><p id="total-tables-count" class="total-count-label"></p><div id="admin-panel" class="admin-panel" style="display:none"><h3>➕ إضافة طاولة جديدة</h3><div class="row"><input id="new-table-num" placeholder="رقم/اسم الطاولة"><input id="new-table-names" placeholder="الأسماء (أفصل بنقطة)"><button onclick="addTable()">إضافة</button></div></div><p class="dev-credit">Developer: Anwar Abo Saad</p><p class="dev-credit">Organiser: Hossam Abo Saad</p><p class="dev-credit">Designer: Mazen Ghanoum</p><div id="results" class="tables-container"></div></div>
<div id="seating-view"><p class="dev-credit">Developer: Anwar Abo Saad</p><p class="dev-credit">Organiser: Hossam Abo Saad</p><p class="dev-credit">Designer: Mazen Ghanoum</p><div id="seating-toolbar" style="display:none"><button id="add-table-map-btn" onclick="openAddTableToMap()">+ إضافة طاولة</button><button id="add-aisle-btn" onclick="addAisleToMap()">+ إضافة ممر العروسين</button></div><div id="floor-plan-wrapper"><div id="floor-plan"><svg id="floor-svg"></svg><div id="dance-label" class="floor-label">ساحة<br>الرقص</div></div></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const ADMIN_PASSWORD="2412";
const firebaseConfig={apiKey:"AIzaSyDRGodtyKvHhIyO33AeSHOFcTTzkEKEXWE",authDomain:"wedding-5ee28.firebaseapp.com",projectId:"wedding-5ee28",storageBucket:"wedding-5ee28.firebasestorage.app",messagingSenderId:"446620021297",appId:"1:446620021297:web:f1c6efca483f0a09f01b10"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),tablesRef=db.collection("app").doc("guest-tables"),seatingRef=db.collection("app").doc("seating-layout");
const defaultTables={};
let currentData={},placements={},circleSlots={},isUnlocked=false,currentView="search",dragState=null,danceGeo={cx:0,cy:0,r:0};const CIRCLE_SLOTS_COUNT=15,AISLE_KEY="__AISLE__";
const $=id=>document.getElementById(id),resultsDiv=$("results"),totalCountEl=$("total-count"),totalTablesCountEl=$("total-tables-count"),searchInput=$("search"),statusEl=$("save-status"),lockBtn=$("lock-btn"),adminPanel=$("admin-panel"),searchView=$("search-view"),seatingView=$("seating-view"),seatingToolbar=$("seating-toolbar"),chartBtn=$("chart-btn"),floorPlan=$("floor-plan"),floorSvg=$("floor-svg"),danceLabel=$("dance-label"),modalOverlay=$("modal-overlay"),modalBox=$("modal-box");
function toggleLock(){if(isUnlocked){isUnlocked=false;updateLockUI();renderCurrentView();return}const v=prompt("أدخل كلمة السر للفتح:");if(v===null)return;if(v===ADMIN_PASSWORD){isUnlocked=true;updateLockUI();renderCurrentView()}else alert("كلمة السر غير صحيحة")}
function updateLockUI(){lockBtn.textContent=isUnlocked?"🔓":"🔒";lockBtn.classList.toggle("unlocked",isUnlocked);adminPanel.style.display=isUnlocked&&currentView==="search"?"block":"none";seatingToolbar.style.display=isUnlocked&&currentView==="seating"?"flex":"none"}
function toggleView(){currentView=currentView==="search"?"seating":"search";searchView.style.display=currentView==="search"?"block":"none";seatingView.style.display=currentView==="seating"?"block":"none";chartBtn.textContent=currentView==="search"?"🪑":"🔎";updateLockUI();renderCurrentView()}
function renderCurrentView(){currentView==="search"?renderTables(searchInput.value.trim()||null):(drawFloorPlan(),renderCircleSlots(),renderPlacements())}
function drawFloorPlan(){const w=floorPlan.clientWidth,h=floorPlan.clientHeight;if(!w||!h)return;floorSvg.setAttribute("viewBox",`0 0 ${w} ${h}`);const cy=h/2,r=Math.min(w,h)*.22,cx=4;danceGeo={cx,cy,r};floorSvg.innerHTML=`<path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r}" stroke="#b08d57" stroke-width="2" stroke-dasharray="7 7" fill="none"/>`;danceLabel.style.left=cx+r*.5+"px";danceLabel.style.top=cy+"px"}
addEventListener("resize",()=>{if(currentView==="seating"){drawFloorPlan();renderCircleSlots();renderPlacements()}});
function normalizeTables(data){const out={};Object.keys(data).forEach(k=>{const v=data[k];out[k]=Array.isArray(v)?{count:null,tablesCount:null,names:v}:v&&typeof v==="object"?{count:typeof v.count==="number"?v.count:null,tablesCount:typeof v.tablesCount==="number"?v.tablesCount:null,names:Array.isArray(v.names)?v.names:[]}:{count:null,tablesCount:null,names:[]}});return out}
function startListening(){statusEl.textContent="جارِ الاتصال...";tablesRef.onSnapshot(async s=>{if(s.exists&&s.data().tables){currentData=normalizeTables(s.data().tables);statusEl.textContent=""}else{currentData=normalizeTables(JSON.parse(JSON.stringify(defaultTables)));await tablesRef.set({tables:currentData})}cleanupSeatingAssignments();renderCurrentView()},()=>statusEl.textContent="⚠ خطأ بالاتصال");seatingRef.onSnapshot(s=>{const d=s.exists?s.data():{};placements=d.placements||{};circleSlots=d.circleSlots||{};if(currentView==="seating"){renderCircleSlots();renderPlacements()}})}
async function saveData(){try{statusEl.textContent="جارِ الحفظ...";await tablesRef.set({tables:currentData});statusEl.textContent="✔ تم الحفظ";setTimeout(()=>statusEl.textContent="",1500)}catch(e){statusEl.textContent="⚠ فشل الحفظ"}}
async function saveSeatingDoc(){try{await seatingRef.set({placements,circleSlots})}catch(e){console.error(e)}}
function cleanupSeatingAssignments(){const valid=new Set(Object.keys(currentData));let changed=false;Object.keys(placements).forEach(k=>{if(k!==AISLE_KEY&&!valid.has(k)){delete placements[k];changed=true}});Object.keys(circleSlots).forEach(i=>{if(!valid.has(circleSlots[i])){delete circleSlots[i];changed=true}});if(changed)saveSeatingDoc()}
function sortedTableKeys(){return Object.keys(currentData).sort((a,b)=>{const x=Number(a),y=Number(b);return !isNaN(x)&&!isNaN(y)?x-y:a.localeCompare(b,"ar")})}
function renderTables(filter){resultsDiv.innerHTML="";let found=false;sortedTableKeys().forEach(table=>{const t=currentData[table],matches=filter?t.names.filter(n=>n.includes(filter)):t.names;if(filter&&!matches.length)return;found=true;const card=document.createElement("div");card.className="card";const list=t.names.map((n,i)=>`<li><span class="${filter&&n.includes(filter)?"highlight":""}">${i+1}. ${n}</span>${isUnlocked?`<span class="del-guest" onclick="deleteGuest('${table}','${n.replace(/'/g,"\\'")}')">✕</span>`:""}</li>`).join("");const actions=isUnlocked?`<span class="table-actions"><span class="edit-table" onclick="renameTable('${table.replace(/'/g,"\\'")}')">✏️ تعديل الاسم</span><span class="del-table" onclick="deleteTable('${table}')">حذف الطاولة</span></span>`:"";const cf=(name,label,val,fn)=>isUnlocked?`<div class="count-field">${label}: <input type="number" min="0" value="${val??""}" placeholder="—" onchange="${fn}('${table}',this.value)"></div>`:`<div class="count-field-readonly">${label}: ${val??"—"}</div>`;card.innerHTML=`<h3>طاولة ${table}${actions}</h3>${cf("count","عدد الأشخاص",t.count,"updateTableCount")}${cf("tablesCount","عدد الطاولات",t.tablesCount,"updateTableTablesCount")}<ul>${list}</ul>${isUnlocked?`<div class="add-guest-row"><input id="add-guest-${table}" placeholder="اسم معزوم جديد"><button onclick="addGuest('${table}')">إضافة</button></div>`:""}`;resultsDiv.appendChild(card)});if(!found)resultsDiv.innerHTML='<p class="no-results">لا يوجد نتائج</p>';updateTotalCount()}
function updateTotalCount(){totalCountEl.textContent=`إجمالي عدد الأشخاص: ${Object.values(currentData).reduce((s,t)=>s+(typeof t.count==="number"?t.count:0),0)}`;totalTablesCountEl.textContent=`إجمالي عدد الطاولات: ${Object.values(currentData).reduce((s,t)=>s+(typeof t.tablesCount==="number"?t.tablesCount:0),0)}`}
searchInput.addEventListener("input",function(){renderTables(this.value.trim()||null)});
async function addTable(){const a=$("new-table-num"),b=$("new-table-names"),num=a.value.trim();if(!num||currentData[num])return alert("اسم الطاولة فارغ أو مستخدم مسبقاً");currentData[num]={count:null,tablesCount:null,names:b.value.trim()?b.value.split(".").map(x=>x.trim()).filter(Boolean):[]};a.value=b.value="";await saveData()}
async function deleteTable(t){if(confirm(`متأكد من حذف الطاولة "${t}"؟`)){delete currentData[t];await saveData()}}
async function updateTableCount(t,v){currentData[t].count=v.trim()===""?null:Math.max(0,parseInt(v,10)||0);await saveData()}
async function updateTableTablesCount(t,v){currentData[t].tablesCount=v.trim()===""?null:Math.max(0,parseInt(v,10)||0);await saveData()}
async function renameTable(old){const n=prompt("اسم الطاولة الجديد:",old);if(n===null)return;const x=n.trim();if(!x||x===old)return;if(currentData[x])return alert("في طاولة تانية مسجلة بنفس هالاسم");const rebuilt={};Object.keys(currentData).forEach(k=>rebuilt[k===old?x:k]=currentData[k]);currentData=rebuilt;await saveData();if(placements[old]){placements[x]=placements[old];delete placements[old];await saveSeatingDoc()}}
async function addGuest(t){const i=$(`add-guest-${t}`),n=i.value.trim();if(n){currentData[t].names.push(n);await saveData()}}
async function deleteGuest(t,n){currentData[t].names=currentData[t].names.filter(x=>x!==n);await saveData()}
function computeLength(k){if(k===AISLE_KEY)return 200;if(!currentData[k])return 60;return Math.min(40+(currentData[k].count||0)*4,300)}
function renderPlacements(){floorPlan.querySelectorAll(".table-box,.aisle-box").forEach(e=>e.remove());Object.keys(placements).forEach(k=>{const p=placements[k],aisle=k===AISLE_KEY;if(!aisle&&!currentData[k])return;const el=document.createElement("div");el.className=(aisle?"aisle-box ":"table-box ")+(isUnlocked?"editable":"locked-view");el.style.left=p.x+"%";el.style.top=p.y+"%";el.style.width=(aisle?200:computeLength(k))+"px";el.style.height=(aisle?12:15)+"px";el.style.transform=`translate(-50%,-50%) rotate(${p.rot||0}deg)`;el.dataset.table=k;if(aisle)el.textContent="ممر العروسين";else{const t=currentData[k];el.innerHTML=`<div class="box-name">${k}</div><div class="box-count">${t.count??"—"}/${t.tablesCount??"—"}</div>`}if(isUnlocked){el.addEventListener("pointerdown",onBoxPointerDown);[["⟲",-10,15],["⟳",16,-10]].forEach(([txt,left,d])=>{const b=document.createElement("div");b.className="box-ctrl box-rotate";b.textContent=txt;b.style.left=left+"px";b.style.top="-10px";b.onpointerdown=e=>e.stopPropagation();b.onclick=e=>{e.stopPropagation();rotateTable(k,d)};el.appendChild(b)});const d=document.createElement("div");d.className="box-ctrl box-delete";d.textContent="✕";d.style.right=d.style.top="-10px";d.onpointerdown=e=>e.stopPropagation();d.onclick=e=>{e.stopPropagation();removeTableFromMap(k)};el.appendChild(d)}floorPlan.appendChild(el)});updateAisleButtonState()}
function onBoxPointerDown(e){if(!isUnlocked)return;const box=e.currentTarget,k=box.dataset.table;box.setPointerCapture(e.pointerId);box.classList.add("dragging");dragState={tableKey:k,box,rect:floorPlan.getBoundingClientRect(),startX:e.clientX,startY:e.clientY,origX:placements[k].x,origY:placements[k].y};box.addEventListener("pointermove",onBoxPointerMove);box.addEventListener("pointerup",onBoxPointerUp);box.addEventListener("pointercancel",onBoxPointerUp)}
function onBoxPointerMove(e){if(!dragState)return;const x=Math.max(2,Math.min(98,dragState.origX+(e.clientX-dragState.startX)/dragState.rect.width*100)),y=Math.max(2,Math.min(98,dragState.origY+(e.clientY-dragState.startY)/dragState.rect.height*100));dragState.box.style.left=x+"%";dragState.box.style.top=y+"%";dragState.currentX=x;dragState.currentY=y}
async function onBoxPointerUp(){if(!dragState)return;const s=dragState;s.box.classList.remove("dragging");if(s.currentX!==undefined){placements[s.tableKey].x=s.currentX;placements[s.tableKey].y=s.currentY;await saveSeatingDoc()}dragState=null}
async function rotateTable(k,d){placements[k].rot=(((placements[k].rot||0)+d)%360+360)%360;await saveSeatingDoc();renderPlacements()}
async function removeTableFromMap(k){delete placements[k];await saveSeatingDoc();renderPlacements()}
function getUsedTableKeys(){const s=new Set();Object.keys(placements).forEach(k=>{if(k!==AISLE_KEY)s.add(k)});Object.values(circleSlots).forEach(k=>s.add(k));return s}
function openAddTableToMap(){if(!isUnlocked)return alert("افتح القفل 🔒 أولاً");const available=sortedTableKeys().filter(k=>!getUsedTableKeys().has(k));modalBox.innerHTML=`<h3>اختر الطاولة</h3>${available.length?available.map(k=>`<button class="modal-option" onclick="addTableToMap('${k.replace(/'/g,"\\'")}')">${k} (${currentData[k].count||0} شخص)</button>`).join(""):'<p style="text-align:center;color:#777">كل الطاولات مضافة عالخريطة مسبقاً</p>'}<button class="modal-close" onclick="closeModal()">إغلاق</button>`;modalOverlay.style.display="flex"}
async function addTableToMap(k){placements[k]={x:75,y:50,rot:0};await saveSeatingDoc();closeModal();renderPlacements()}
function renderCircleSlots(){floorPlan.querySelectorAll(".slot-box").forEach(e=>e.remove());if(!danceGeo.r)return;const{cx,cy,r}=danceGeo;for(let i=0;i<CIRCLE_SLOTS_COUNT;i++){const angle=-85+i/(CIRCLE_SLOTS_COUNT-1)*170,rad=angle*Math.PI/180,assigned=circleSlots[i],ok=assigned&&currentData[assigned],len=ok?computeLength(assigned):45,x=cx+(r+10+len/2)*Math.cos(rad),y=cy+(r+10+len/2)*Math.sin(rad),slot=document.createElement("div");slot.style.cssText=`left:${x}px;top:${y}px;width:${len}px;height:20px;transform:translate(-50%,-50%) rotate(${angle}deg)`;if(ok){const t=currentData[assigned];slot.className="slot-box filled"+(isUnlocked?" clickable":"");slot.innerHTML=`<div class="box-name">${assigned}</div><div class="box-count">${t.count??"—"}/${t.tablesCount??"—"}</div>`;if(isUnlocked)slot.onclick=()=>openCircleSlotPicker(i)}else{slot.className="slot-box empty"+(isUnlocked?" clickable":"");slot.textContent="+";if(isUnlocked)slot.onclick=()=>openCircleSlotPicker(i)}floorPlan.appendChild(slot)}}
function openCircleSlotPicker(i){if(!isUnlocked)return;const current=circleSlots[i],used=getUsedTableKeys(),available=sortedTableKeys().filter(k=>!used.has(k)||k===current);modalBox.innerHTML=`<h3>اختر الطاولة لهالمكان</h3>${available.length?available.map(k=>`<button class="modal-option" onclick="assignCircleSlot(${i},'${k.replace(/'/g,"\\'")}')">${k} (${currentData[k].count||0} شخص)</button>`).join(""):'<p style="text-align:center;color:#777">كل الطاولات مضافة مسبقاً</p>'}<button class="modal-close" onclick="closeModal()">إغلاق</button>`;modalOverlay.style.display="flex"}
async function assignCircleSlot(i,k){circleSlots[i]=k;await saveSeatingDoc();closeModal();renderCircleSlots()}
function updateAisleButtonState(){const b=$("add-aisle-btn");if(b)b.disabled=!!placements[AISLE_KEY]}
async function addAisleToMap(){if(!isUnlocked||placements[AISLE_KEY])return;placements[AISLE_KEY]={x:50,y:15,rot:0};try{await seatingRef.set({placements,circleSlots});renderPlacements()}catch(e){console.error(e);delete placements[AISLE_KEY];alert("تعذر حفظ ممر العروسين. تحقق من اتصال Firebase.");renderPlacements()}}

</script></body></html>
